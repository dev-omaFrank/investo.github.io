<body class="account-body accountbg">
    <!-- Log In page -->
    <div class="container">
        <div class="row vh-100 d-flex justify-content-center">
            <div class="col-12 align-self-center">
                <div class="row">
                    <div class="col-lg-5 mx-auto">
                        <div class="card">
                            <div class="card-body p-0 auth-header-box">
                                <div class="text-center p-3">
                                    <a href="index.html" class="logo logo-admin"><img src="avalog.png" height="50" alt="logo" class="auth-logo"></a>

                                </div>
                            </div>
                            <div class="card-body">

                                <ul class="nav-border nav nav-pills" role="tablist">
                                    <li class="nav-item"><a class="nav-link active font-weight-semibold" data-toggle="tab" href="#Register_Tab" role="tab">Register</a></li>
                                    <li class="nav-item"><a class="nav-link font-weight-semibold" href="login.html">Login</a></li>
                                </ul>
                                <!-- Tab panes -->
                                <div class="tab-pane active px-3 pt-3" id="Register_Tab" role="tabpanel">
                                    <form class="auth-form" name="regform" class="form-horizontal auth-form my-4">
                                        <table cellspacing=0 cellpadding=2 border=0 width=100%>
                                            <div class="form-group"><label for="username">Full Name</label>
                                                <div class="input-group mb-3">
                                                    <input type=text name=fullname value="" class="form-control" size=30 placeholder="Enter Full Name"></div>
                                            </div>
                                            <div class="form-group"><label for="username">Username</label>
                                                <div class="input-group mb-3">
                                                    <input type=text name=username value="" class="form-control" size=30 placeholder="Enter Username"></div>
                                            </div>
                                            <div class="form-group"><label for="username">Define Password</label>
                                                <div class="input-group mb-3">
                                                    <input type=password name=password value="" class="form-control" size=30 placeholder="Enter Password"></div>
                                            </div>
                                            <div class="form-group"><label for="username">Retype Password</label>
                                                <div class="input-group mb-3">
                                                    <input type=password name=password2 value="" class="form-control" size=30 placeholder="Enter Retype Password"></div>
                                            </div>



                                            <div class="form-group"><label for="username">E-mail Address</label>
                                                <div class="input-group mb-3">
                                                    <input type=email name=email value="" class="form-control" size=30 placeholder="Enter Email"></div>
                                            </div>
                                            <div class="form-group"><label for="username">Retype E-mail</label>
                                                <div class="input-group mb-3">
                                                    <input type=email name=email1 value="" class="form-control" size=30 placeholder="Enter Retype Email"></div>
                                            </div>
                                            <div class="form-group"><label for="username">Secret question(Optional)</label>
                                                <div class="input-group mb-3">
                                                    <input type=text name=sq value="" class="form-control" size=30 placeholder="Enter Secret question"></div>
                                            </div>
                                            <div class="form-group"><label for="username">Secret answer(Optional)</label>
                                                <div class="input-group mb-3">
                                                    <input type=text name=sa value="" class="form-control" size=30 placeholder="Enter Secret answer"></div>
                                            </div>
                 
                                            <div class="form-group row mt-4">
                                                <div class="col-sm-12">
                                                    <div class="custom-control custom-switch switch-success">
                                                        <input type=checkbox name=agree value=0 class="custom-control-input" id="customSwitchSuccess">
                                                        <label class="custom-control-label text-muted" for="customSwitchSuccess">I agree with <a href="indexa972.html?a=rules" class="text-primary">Terms and conditions</a></label>
                                                    </div>
                                                </div>
                                                <!--end col-->
                                            </div>
                                            <!--end form-group-->
                                            <div class="form-group mb-0 row">
                                                <div class="col-12 mt-2">
                                                    <button class="btn btn-primary btn-block waves-effect waves-light" onclick="return signup_checkform()" type="button" value="Register">Register <i class="fas fa-sign-in-alt ml-1"></i></button></div>
                                                <!--end col-->
                                            </div>
                                            <!--end form-group-->
                                        </table>
                                    </form>
                                    <!--end form-->
                                    <p class="mb-0 text-muted">Already have an account ?<a href="login.html" class="text-primary ml-2">Log in</a></p>
                                </div>
                            </div>
                            <!--end card-body-->
                            <div class="card-body bg-light-alt text-center"><span class="text-muted d-none d-sm-inline-block">Investo ©
                                2022</span></div>

                    <!--end col-->
